# Añade el Dockerfile como servicio llamado "web"
version: '3.8'
name: auvmp
services:
  web:
    build: .
    ports:
      - "8000:8080"
    volumes:
      - .:/code
    depends_on:
      - db
  db:
    image: mariadb:10.5.21
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: auvmp
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - ./tmp:/var/lib/mysql
    ports:
      - "3366:3306"